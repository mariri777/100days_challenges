<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まどろみタイマー — 仮眠・休憩タイマー</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#f3f0f7;--bg2:#e7e2ef;
    --paper:#fffdfb;
    --ink:#3a3542;--sub:#8f8a9c;
    --accent:#7a6f9c;--accent-soft:#a99fc4;--accent-deep:#645a86;
    --ring-bg:#e6e0ef;--line:#e6e1ee;
    --shadow:rgba(90,75,120,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden}
  body{
    font-family:"Zen Kaku Gothic New",sans-serif;
    background:radial-gradient(1100px 620px at 50% -6%, #faf8fc 0%, var(--bg1) 45%, var(--bg2) 100%);
    color:var(--ink);line-height:1.7;min-height:100vh;
    padding:0 20px 56px;-webkit-font-smoothing:antialiased;
  }
  .mincho{font-family:"Shippori Mincho B1",serif;}
  .wrap{max-width:560px;margin:0 auto;}

  header{text-align:center;padding:46px 0 20px;}
  .kicker{font-size:.72rem;letter-spacing:.34em;color:var(--accent);font-weight:500;margin-bottom:15px;text-indent:.34em;}
  h1{font-family:"Shippori Mincho B1",serif;font-weight:600;font-size:2.05rem;letter-spacing:.1em;margin-bottom:11px;
     display:flex;align-items:center;justify-content:center;gap:.4em;}
  h1 .moon{color:var(--accent-soft);display:inline-flex;}
  .lead{font-size:.87rem;color:var(--sub);letter-spacing:.03em;}

  /* ---- presets ---- */
  .presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 8px;}
  .pre{
    position:relative;font-family:inherit;font-size:.9rem;padding:10px 16px;border-radius:13px;
    border:1px solid var(--line);background:var(--paper);color:var(--sub);cursor:pointer;transition:.16s;
    letter-spacing:.02em;min-width:64px;
  }
  .pre b{font-family:"Shippori Mincho B1",serif;font-size:1.05rem;color:inherit;font-weight:600;}
  .pre:hover{border-color:var(--accent-soft);color:var(--ink);}
  .pre[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 16px -9px var(--shadow);}
  .pre .rec{
    position:absolute;top:-8px;right:-6px;font-size:.6rem;letter-spacing:.05em;font-weight:700;
    background:var(--accent-soft);color:#fff;padding:2px 6px;border-radius:8px;
  }
  .pre[aria-pressed="true"] .rec{background:#fff;color:var(--accent);}

  .custom{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 4px;color:var(--sub);font-size:.85rem;}
  .stepper{display:flex;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;}
  .stepper button{
    width:34px;height:34px;border:none;background:transparent;color:var(--accent);font-size:1.3rem;cursor:pointer;border-radius:9px;line-height:1;transition:.14s;
  }
  .stepper button:hover{background:var(--ring-bg);}
  .stepper .val{min-width:60px;text-align:center;font-family:"Shippori Mincho B1",serif;font-size:1.05rem;color:var(--ink);}
  .stepper .val small{font-family:"Zen Kaku Gothic New";font-size:.7rem;color:var(--sub);margin-left:2px;}

  /* ---- timer dial ---- */
  .dial-card{
    background:var(--paper);border:1px solid var(--line);border-radius:24px;
    padding:34px 26px 30px;margin-top:24px;text-align:center;
    box-shadow:0 22px 48px -28px var(--shadow);
  }
  .dial{position:relative;width:260px;height:260px;margin:0 auto;}
  .dial svg{transform:rotate(-90deg);width:100%;height:100%;}
  .dial .track{fill:none;stroke:var(--ring-bg);stroke-width:12;}
  .dial .prog{fill:none;stroke:url(#grad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .3s linear;}
  .dial-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  .time{font-family:"Shippori Mincho B1",serif;font-size:3.1rem;letter-spacing:.03em;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .wake{font-size:.82rem;color:var(--sub);letter-spacing:.04em;}
  .wake b{color:var(--accent);font-weight:600;font-family:"Shippori Mincho B1",serif;letter-spacing:.05em;}
  .state-label{font-size:.78rem;color:var(--accent-soft);letter-spacing:.18em;margin-bottom:2px;height:1em;}

  .dial.done .prog{stroke:url(#grad);}
  .dial.done{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.02);}}

  /* ---- controls ---- */
  .controls{display:flex;gap:12px;justify-content:center;margin-top:26px;}
  .btn{
    font-family:inherit;font-size:.95rem;font-weight:500;letter-spacing:.08em;cursor:pointer;transition:.16s;
    border-radius:14px;padding:15px 30px;border:1px solid transparent;
  }
  .btn.main{background:linear-gradient(135deg,#8b7fb0,var(--accent-deep));color:#fff;
    box-shadow:0 12px 24px -12px rgba(100,80,140,.6);min-width:150px;font-family:"Shippori Mincho B1",serif;}
  .btn.main:hover{transform:translateY(-1px);}
  .btn.main:active{transform:translateY(0);}
  .btn.sub{background:var(--paper);border-color:var(--line);color:var(--sub);}
  .btn.sub:hover{border-color:var(--accent-soft);color:var(--ink);}

  .hint{margin-top:20px;font-size:.75rem;color:var(--sub);letter-spacing:.03em;line-height:1.9;}

  .backlink{text-align:center;margin-top:32px;}
  .backlink a{color:var(--sub);font-size:.78rem;text-decoration:none;letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:2px;}
  .backlink a:hover{color:var(--accent);}

  @media (max-width:640px){
    header{padding:34px 0 16px;}
    h1{font-size:1.7rem;}
    .dial{width:220px;height:220px;}
    .time{font-size:2.6rem;}
    .dial-card{padding:28px 18px 26px;border-radius:20px;}
    .btn{padding:14px 22px;}
    .btn.main{min-width:130px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">NAP &amp; REST TIMER</div>
    <h1 class="mincho">まどろみタイマー<span class="moon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
    </span></h1>
    <p class="lead">仮眠と休憩に。起きる時刻まで、静かに数えます。</p>
  </header>

  <div class="presets" id="presets"></div>

  <div class="custom">
    <span>自由に設定</span>
    <div class="stepper">
      <button id="minus" aria-label="1分減らす">−</button>
      <span class="val"><span id="customVal">20</span><small>分</small></span>
      <button id="plus" aria-label="1分増やす">＋</button>
    </div>
  </div>

  <div class="dial-card">
    <div class="state-label" id="stateLabel"></div>
    <div class="dial" id="dial">
      <svg viewBox="0 0 260 260">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a99fc4"/>
            <stop offset="1" stop-color="#7a6f9c"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="130" cy="130" r="116"/>
        <circle class="prog" id="prog" cx="130" cy="130" r="116"/>
      </svg>
      <div class="dial-center">
        <div class="time" id="time">20:00</div>
        <div class="wake" id="wake">起きる時刻 <b id="wakeTime">--:--</b></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn main mincho" id="startBtn">はじめる</button>
      <button class="btn sub" id="resetBtn">リセット</button>
    </div>

    <div class="hint" id="hint">20分の仮眠は、深く眠りすぎず頭がすっきりします。</div>
  </div>

  <div class="backlink"><a href="index.html">← 100 Days Challenge にもどる</a></div>
</div>

<script>
  const $ = id => document.getElementById(id);

  const PRESETS = [
    {m:10, note:'短い休憩に。目を閉じるだけでも回復します。'},
    {m:15, note:'軽い仮眠に。すっと起きやすい長さです。'},
    {m:20, rec:'おすすめ', note:'20分の仮眠は、深く眠りすぎず頭がすっきりします。'},
    {m:25, note:'少ししっかり休みたいときに。'},
    {m:30, note:'30分を超えると深い眠りに入りやすいので、目安の上限です。'},
    {m:45, note:'しっかりめの休息に。起きたら少しゆっくり動き出しましょう。'},
    {m:60, note:'1時間の休息。寝すぎに感じたら短めに調整を。'},
    {m:90, rec:'1周期', note:'90分は睡眠1サイクルの目安。すっきり目覚めやすい長さです。'},
  ];

  const R = 116, C = 2 * Math.PI * R;
  $('prog').style.strokeDasharray = C;
  $('prog').style.strokeDashoffset = 0;

  const state = {
    durationSec: 20*60,
    remainingSec: 20*60,
    running: false,
    endAt: 0,
    finished: false,
  };
  let intervalId = null, finishTimeout = null, chimeTimer = null, audioCtx = null;

  // --- build presets ---
  function buildPresets(){
    const el = $('presets'); el.innerHTML='';
    PRESETS.forEach(p=>{
      const b=document.createElement('button');
      b.className='pre';
      b.innerHTML = `<b>${p.m}</b>分` + (p.rec?`<span class="rec">${p.rec}</span>`:'');
      b.setAttribute('aria-pressed', state.durationSec===p.m*60 && !isCustom(p.m));
      b.onclick=()=>{ if(state.running) return; setDuration(p.m); $('hint').textContent=p.note; };
      el.appendChild(b);
    });
  }
  function isCustom(m){ return false; }

  function setDuration(min){
    state.durationSec = min*60;
    state.remainingSec = min*60;
    state.finished = false;
    $('customVal').textContent = min;
    stopChime();
    $('dial').classList.remove('done');
    $('stateLabel').textContent = '';
    render();
    syncPresetHighlight();
  }
  function syncPresetHighlight(){
    const min = state.durationSec/60;
    [...$('presets').children].forEach((b,i)=>{
      b.setAttribute('aria-pressed', PRESETS[i].m===min);
    });
  }

  function pad(n){ return String(n).padStart(2,'0'); }
  function fmt(sec){
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return pad(m)+':'+pad(s);
  }
  function wakeClock(){
    // time when timer will finish
    const ms = state.running ? state.endAt : (Date.now() + state.remainingSec*1000);
    const d = new Date(ms);
    return pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function render(){
    $('time').textContent = fmt(state.remainingSec);
    $('wakeTime').textContent = wakeClock();
    const prog = state.durationSec ? state.remainingSec/state.durationSec : 0;
    // full ring at start, depletes toward 0
    $('prog').style.strokeDashoffset = C * (1 - prog);
  }

  function clearTimers(){
    if(intervalId){ clearInterval(intervalId); intervalId=null; }
    if(finishTimeout){ clearTimeout(finishTimeout); finishTimeout=null; }
  }
  function tick(){
    if(!state.running) return;
    const rem = (state.endAt - Date.now())/1000;
    state.remainingSec = rem;
    if(rem <= 0){
      finish();
      return;
    }
    render();
  }

  function start(){
    if(state.running || state.remainingSec<=0) return;
    ensureAudio();
    state.running = true;
    state.finished = false;
    state.endAt = Date.now() + state.remainingSec*1000;
    $('startBtn').textContent = 'ストップ';
    $('stateLabel').textContent = 'おやすみなさい';
    $('dial').classList.remove('done');
    clearTimers();
    // setInterval keeps counting even when the tab is in the background
    intervalId = setInterval(tick, 250);
    // safety net so the alarm still fires on time if the interval is throttled
    finishTimeout = setTimeout(()=>{ if(state.running) finish(); }, state.remainingSec*1000 + 60);
    tick();
  }
  function pause(){
    if(!state.running) return;
    state.remainingSec = Math.max(0,(state.endAt - Date.now())/1000);
    state.running = false;
    clearTimers();
    $('startBtn').textContent = 'つづける';
    $('stateLabel').textContent = '一時停止';
    render();
  }
  function reset(){
    state.running = false;
    state.finished = false;
    clearTimers();
    stopChime();
    state.remainingSec = state.durationSec;
    $('startBtn').textContent = 'はじめる';
    $('stateLabel').textContent = '';
    $('dial').classList.remove('done');
    render();
  }
  function finish(){
    state.running = false;
    state.finished = true;
    state.remainingSec = 0;
    clearTimers();
    render();
    $('dial').classList.add('done');
    $('startBtn').textContent = '止める';
    $('stateLabel').textContent = 'おはよう';
    $('wakeTime').textContent = wakeClock();
    startChime();
    if(navigator.vibrate) try{ navigator.vibrate([200,120,200]); }catch(e){}
  }

  // --- start/stop button toggles by state ---
  $('startBtn').onclick=()=>{
    if(state.finished){ reset(); return; }
    if(state.running){ pause(); }
    else{ start(); }
  };
  $('resetBtn').onclick=reset;

  // --- stepper (custom minutes) ---
  function stepCustom(delta){
    if(state.running) return;
    let m = Math.round(state.durationSec/60) + delta;
    m = Math.min(180, Math.max(1, m));
    setDuration(m);
    const preset = PRESETS.find(p=>p.m===m);
    $('hint').textContent = preset ? preset.note : `${m}分に設定しました。`;
  }
  $('plus').onclick=()=>stepCustom(1);
  $('minus').onclick=()=>stepCustom(-1);

  // --- gentle chime via Web Audio ---
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
    }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }
  function bell(t){
    if(!audioCtx) return;
    // soft two-note chime (fifth), sine with gentle decay
    [ [880,0], [1174.66,0.16] ].forEach(([freq,off])=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=freq;
      const start=t+off;
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.22, start+0.04);
      g.gain.exponentialRampToValueAtTime(0.0008, start+1.6);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(start); o.stop(start+1.7);
    });
  }
  function startChime(){
    ensureAudio();
    if(!audioCtx) return;
    const ring = ()=> bell(audioCtx.currentTime);
    ring();
    chimeTimer = setInterval(ring, 2600);
    // auto-stop after ~40s so it never rings forever
    setTimeout(stopChime, 40000);
  }
  function stopChime(){
    if(chimeTimer){ clearInterval(chimeTimer); chimeTimer=null; }
  }

  // re-sync display the moment the tab becomes visible again
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.running) tick(); });

  // init
  buildPresets();
  setDuration(20);
</script>
</body>
</html>
