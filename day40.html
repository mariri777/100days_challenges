<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>サブスク棚卸し — 実は年間いくら払ってる？</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --bg: #eef0ee;
    --bg-soft: #f7f8f6;
    --panel: #ffffff;
    --ink: #2f3a3d;
    --ink-soft: #6a767a;
    --ink-faint: #9aa4a6;
    --line: #dde2e1;
    --line-soft: #eceff0;
    --accent: #4f7d86;
    --accent-deep: #3e6870;
    --warn: #b5734e;
    --shadow: 0 18px 42px -26px rgba(40, 60, 62, 0.4);
    --radius: 18px;

    /* カテゴリ色（ニュアンストーン） */
    --c-video: #5f88a6;
    --c-music: #6f9a86;
    --c-work:  #7d6f9a;
    --c-game:  #b3654e;
    --c-read:  #c2914e;
    --c-life:  #5a9a97;
    --c-etc:   #9aa0a0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: "Zen Kaku Gothic New", sans-serif;
    background:
      radial-gradient(1100px 560px at 82% -12%, #eef4f3 0%, transparent 55%),
      radial-gradient(880px 480px at -10% 8%, #e7ebe9 0%, transparent 52%),
      var(--bg);
    color: var(--ink);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap { max-width: 820px; margin: 0 auto; padding: 56px 24px 96px; }

  /* ---- ヘッダー ---- */
  header.masthead { text-align: center; margin-bottom: 36px; }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.42em;
    color: var(--ink-faint); text-indent: 0.42em; margin-bottom: 18px;
  }
  h1 {
    font-family: "Shippori Mincho", serif; font-weight: 700;
    font-size: clamp(30px, 6vw, 44px); letter-spacing: 0.08em;
    margin: 0 0 14px; color: var(--ink);
  }
  .lead { font-size: 14.5px; color: var(--ink-soft); max-width: 30em; margin: 0 auto; }

  /* ---- 合計ヒーロー ---- */
  .hero {
    background: linear-gradient(165deg, #3e6870 0%, #4f7d86 55%, #5a8a86 100%);
    color: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 30px 28px; margin-bottom: 22px;
    display: grid; grid-template-columns: 1fr 1px 1fr; gap: 22px; align-items: center;
    position: relative; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .hero .cell { text-align: center; position: relative; z-index: 1; }
  .hero .cell .lbl { font-size: 11px; letter-spacing: 0.24em; opacity: 0.82; margin-bottom: 6px; }
  .hero .cell .val {
    font-family: "Shippori Mincho", serif; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .hero .cell .val .yen { font-size: 0.5em; margin-right: 2px; opacity: 0.85; }
  .hero .cell.month .val { font-size: clamp(30px, 8vw, 42px); }
  .hero .cell.year .val { font-size: clamp(26px, 7vw, 38px); opacity: 0.96; }
  .hero .divider { width: 1px; height: 56px; background: rgba(255,255,255,0.25); margin: 0 auto; }
  .hero .sub { font-size: 11px; opacity: 0.7; margin-top: 8px; }

  /* ---- パネル ---- */
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 26px; margin-bottom: 22px;
  }
  .panel-title {
    font-family: "Shippori Mincho", serif; font-size: 16px; letter-spacing: 0.08em;
    margin: 0 0 20px; display: flex; align-items: center; gap: 10px; color: var(--ink);
  }
  .panel-title::before {
    content: ""; width: 5px; height: 16px; border-radius: 3px;
    background: var(--accent); opacity: 0.75;
  }

  /* ---- 入力フォーム ---- */
  .form-grid { display: grid; grid-template-columns: 1fr auto; gap: 14px 16px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-faint); }
  input[type="text"], input[type="number"] {
    font-family: "Zen Kaku Gothic New", sans-serif; font-size: 15px; color: var(--ink);
    background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; outline: none; transition: border-color 0.2s ease; width: 100%;
  }
  input:focus { border-color: var(--accent); }
  .amount-wrap { display: flex; align-items: stretch; gap: 8px; }
  .amount-wrap .yen-mark {
    display: flex; align-items: center; color: var(--ink-faint); font-size: 15px;
  }
  input[type="number"] { width: 130px; -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* サイクル切替 */
  .cycle-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .cycle-toggle button {
    font-family: "Zen Kaku Gothic New", sans-serif; font-size: 14px;
    border: none; background: var(--bg-soft); color: var(--ink-soft);
    padding: 10px 18px; cursor: pointer; transition: all 0.18s ease;
  }
  .cycle-toggle button.on { background: var(--accent); color: #fff; }

  .cat-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat-chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--bg-soft); border-radius: 999px;
    padding: 7px 14px 7px 11px; font-size: 13px; color: var(--ink-soft);
    cursor: pointer; transition: all 0.18s ease;
  }
  .cat-chip .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .cat-chip:hover { border-color: var(--ink-faint); }
  .cat-chip.selected { color: var(--ink); border-color: var(--ink); background: #fff; font-weight: 500; }

  .form-actions { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; margin-top: 4px; }
  .btn-add {
    font-family: "Zen Kaku Gothic New", sans-serif; font-size: 14px; letter-spacing: 0.06em;
    color: #fff; background: var(--accent); border: none; border-radius: 10px;
    padding: 12px 26px; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease;
  }
  .btn-add:hover { background: var(--accent-deep); }
  .btn-add:active { transform: translateY(1px); }
  .form-hint { font-size: 12px; color: var(--ink-faint); }

  /* ---- 内訳バー ---- */
  .sharebar {
    display: flex; height: 16px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); margin-bottom: 18px; background: var(--line-soft);
  }
  .sharebar .seg { height: 100%; transition: opacity 0.2s ease; }
  .sharebar .seg:hover { opacity: 0.85; }

  /* ---- 一覧 ---- */
  .sub-list { display: flex; flex-direction: column; }
  .sub {
    display: grid; grid-template-columns: 12px 1fr auto auto; gap: 14px; align-items: center;
    padding: 14px 4px; border-bottom: 1px solid var(--line-soft);
  }
  .sub:last-child { border-bottom: none; }
  .sub .cdot { width: 12px; height: 12px; border-radius: 50%; }
  .sub .name { font-size: 15px; color: var(--ink); }
  .sub .name .badge {
    font-size: 10.5px; color: var(--ink-soft); background: var(--bg-soft);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; margin-left: 8px;
    vertical-align: middle;
  }
  .sub .name .billed { display: block; font-size: 12px; color: var(--ink-faint); }
  .sub .cost {
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .sub .cost .m {
    font-family: "Shippori Mincho", serif; font-size: 16px; color: var(--ink);
  }
  .sub .cost .m .yen { font-size: 0.72em; color: var(--ink-soft); }
  .sub .cost .y { font-size: 11.5px; color: var(--ink-faint); }
  .sub .del {
    border: none; background: transparent; color: var(--ink-faint); cursor: pointer;
    font-size: 18px; padding: 4px 8px; border-radius: 8px; transition: all 0.18s ease; line-height: 1;
  }
  .sub .del:hover { color: var(--warn); background: var(--line-soft); }

  /* ---- 気づき ---- */
  .insight { background: linear-gradient(180deg, #f3f7f6, #fbfcfb); border: 1px solid #dbe6e4; }
  .insight .panel-title::before { background: var(--warn); }
  .notice {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 13px 15px; border-radius: 12px; background: #fff;
    border: 1px solid #e3ece9; font-size: 14px; color: var(--ink); margin-bottom: 10px;
  }
  .notice:last-child { margin-bottom: 0; }
  .notice .mark {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .notice.big .mark { background: var(--warn); }
  .notice b { font-family: "Shippori Mincho", serif; font-weight: 700; }

  .empty { text-align: center; color: var(--ink-faint); font-size: 13.5px; padding: 26px 10px; }
  .empty .mincho { font-family: "Shippori Mincho", serif; font-size: 15px; color: var(--ink-soft); }

  footer.credit { text-align: center; margin-top: 40px; font-size: 11px; letter-spacing: 0.18em; color: var(--ink-faint); }

  /* ---- レスポンシブ ---- */
  @media (max-width: 640px) {
    .wrap { padding: 40px 16px 80px; }
    .panel, .hero { padding: 22px 16px; }
    .hero { grid-template-columns: 1fr; gap: 16px; }
    .hero .divider { width: 56px; height: 1px; }
    .form-grid { grid-template-columns: 1fr; }
    input[type="number"] { width: 100%; }
    .amount-wrap { width: 100%; }
    .sub { grid-template-columns: 12px 1fr auto; grid-template-areas: "dot name cost" "dot del cost"; row-gap: 4px; }
    .sub .del { grid-column: 2; justify-self: start; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="eyebrow">SUBSCRIPTION AUDIT</div>
      <h1>サブスク棚卸し</h1>
      <p class="lead">入りっぱなしの定額サービス、ぜんぶ足すといくら？<br />「実は年間◯万円」に気づくための、棚卸し帳です。</p>
    </header>

    <!-- 合計ヒーロー -->
    <div class="hero">
      <div class="cell month">
        <div class="lbl">月あたり</div>
        <div class="val"><span class="yen">¥</span><span id="monthTotal">0</span></div>
        <div class="sub" id="countSub">サービス 0件</div>
      </div>
      <div class="divider"></div>
      <div class="cell year">
        <div class="lbl">年あたり</div>
        <div class="val"><span class="yen">¥</span><span id="yearTotal">0</span></div>
        <div class="sub">1年つづけると</div>
      </div>
    </div>

    <!-- 入力 -->
    <section class="panel">
      <h2 class="panel-title">サービスを足す</h2>
      <div class="form-grid">
        <div class="field">
          <label>サービス名</label>
          <input type="text" id="nameInput" placeholder="例：Netflix / Spotify / ジム" maxlength="24" />
        </div>
        <div class="field">
          <label>料金</label>
          <div class="amount-wrap">
            <span class="yen-mark">¥</span>
            <input type="number" id="amountInput" placeholder="1490" min="0" step="1" inputmode="numeric" />
          </div>
        </div>
        <div class="field">
          <label>支払いサイクル</label>
          <div class="cycle-toggle" id="cycleToggle">
            <button type="button" data-cycle="month" class="on">月額</button>
            <button type="button" data-cycle="year">年額</button>
          </div>
        </div>
        <div class="field full">
          <label>カテゴリ</label>
          <div class="cat-row" id="catRow"></div>
        </div>
        <div class="form-actions">
          <button class="btn-add" id="addBtn">棚に足す</button>
          <span class="form-hint" id="formHint">年額のサービスは自動で月あたりに換算します</span>
        </div>
      </div>
    </section>

    <!-- 一覧 -->
    <section class="panel">
      <h2 class="panel-title">棚のなかみ</h2>
      <div class="sharebar" id="shareBar" style="display:none"></div>
      <div class="sub-list" id="subList"></div>
    </section>

    <!-- 気づき -->
    <section class="panel insight" id="insightPanel" style="display:none">
      <h2 class="panel-title">棚卸しの気づき</h2>
      <div id="insightBody"></div>
    </section>

    <footer class="credit">Built by usami_louis</footer>
  </div>

<script>
  "use strict";

  const CATEGORIES = [
    { id: "video", name: "動画",       color: "var(--c-video)" },
    { id: "music", name: "音楽",       color: "var(--c-music)" },
    { id: "work",  name: "仕事・作業", color: "var(--c-work)"  },
    { id: "game",  name: "ゲーム",     color: "var(--c-game)"  },
    { id: "read",  name: "本・雑誌",   color: "var(--c-read)"  },
    { id: "life",  name: "生活",       color: "var(--c-life)"  },
    { id: "etc",   name: "その他",     color: "var(--c-etc)"   },
  ];
  const catById = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

  const STORE_KEY = "subsc-audit-v1";
  let selectedCat = "video";
  let selectedCycle = "month";

  function loadAll() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch { return []; }
  }
  function saveAll(list) { localStorage.setItem(STORE_KEY, JSON.stringify(list)); }

  function monthlyOf(s) { return s.cycle === "year" ? s.amount / 12 : s.amount; }
  function yearlyOf(s)  { return s.cycle === "year" ? s.amount : s.amount * 12; }
  function yen(n) { return Math.round(n).toLocaleString("ja-JP"); }

  function renderCats() {
    const row = document.getElementById("catRow");
    row.innerHTML = "";
    CATEGORIES.forEach(c => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "cat-chip" + (c.id === selectedCat ? " selected" : "");
      chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.name}`;
      chip.addEventListener("click", () => { selectedCat = c.id; renderCats(); });
      row.appendChild(chip);
    });
  }

  function renderTotals(list) {
    const m = list.reduce((sum, s) => sum + monthlyOf(s), 0);
    const y = list.reduce((sum, s) => sum + yearlyOf(s), 0);
    document.getElementById("monthTotal").textContent = yen(m);
    document.getElementById("yearTotal").textContent = yen(y);
    document.getElementById("countSub").textContent = `サービス ${list.length}件`;
  }

  function renderShareBar(list) {
    const bar = document.getElementById("shareBar");
    const total = list.reduce((s, x) => s + monthlyOf(x), 0);
    if (list.length === 0 || total === 0) { bar.style.display = "none"; return; }
    bar.style.display = "flex";
    bar.innerHTML = "";
    list.slice().sort((a, b) => monthlyOf(b) - monthlyOf(a)).forEach(s => {
      const c = catById[s.category] || catById.etc;
      const seg = document.createElement("div");
      seg.className = "seg";
      seg.style.width = (monthlyOf(s) / total * 100) + "%";
      seg.style.background = c.color;
      seg.title = `${s.name}　¥${yen(monthlyOf(s))}/月`;
      bar.appendChild(seg);
    });
  }

  function renderList(list) {
    const wrap = document.getElementById("subList");
    wrap.innerHTML = "";
    if (list.length === 0) {
      wrap.innerHTML = `<div class="empty"><span class="mincho">まだ棚は空っぽです。</span><br />加入中のサービスを足してみましょう。</div>`;
      return;
    }
    list.slice().sort((a, b) => monthlyOf(b) - monthlyOf(a)).forEach(s => {
      const c = catById[s.category] || catById.etc;
      const row = document.createElement("div");
      row.className = "sub";
      const billed = s.cycle === "year"
        ? `年額 ¥${yen(s.amount)}`
        : `月額 ¥${yen(s.amount)}`;
      row.innerHTML =
        `<span class="cdot" style="background:${c.color}"></span>` +
        `<span class="name">${escapeHtml(s.name)}` +
        `<span class="badge">${c.name}</span>` +
        `<span class="billed">${billed}</span></span>` +
        `<span class="cost">` +
          `<span class="m"><span class="yen">¥</span>${yen(monthlyOf(s))}<span style="font-size:11px;color:var(--ink-faint)">/月</span></span>` +
          `<span class="y">年 ¥${yen(yearlyOf(s))}</span>` +
        `</span>` +
        `<button class="del" title="削除" data-id="${s.id}">×</button>`;
      wrap.appendChild(row);
    });
    wrap.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", () => {
        saveAll(loadAll().filter(s => s.id !== btn.getAttribute("data-id")));
        renderAll();
      });
    });
  }

  function renderInsight(list) {
    const panel = document.getElementById("insightPanel");
    const body = document.getElementById("insightBody");
    if (list.length === 0) { panel.style.display = "none"; return; }
    panel.style.display = "block";
    body.innerHTML = "";

    const y = list.reduce((sum, s) => sum + yearlyOf(s), 0);

    // 年間合計をやさしく言い換え
    const man = y / 10000;
    const manStr = man >= 10 ? man.toFixed(0) : man.toFixed(1);
    const n1 = document.createElement("div");
    n1.className = "notice big";
    n1.innerHTML =
      `<span class="mark">!</span>` +
      `<span>いま加入中のサービスは、1年で <b>¥${yen(y)}</b>（約 <b>${manStr}万円</b>）。<br>` +
      `ひと月あたり <b>¥${yen(y / 12)}</b> が自動で出ていく計算です。</span>`;
    body.appendChild(n1);

    // いちばん高いサービス
    const top = list.slice().sort((a, b) => monthlyOf(b) - monthlyOf(a))[0];
    const n2 = document.createElement("div");
    n2.className = "notice";
    n2.innerHTML =
      `<span class="mark">◎</span>` +
      `<span>いちばん大きいのは <b>「${escapeHtml(top.name)}」</b>。やめると年間 <b>¥${yen(yearlyOf(top))}</b> うきます。` +
      `使えているか、ここで一度見直しを。</span>`;
    body.appendChild(n2);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  function renderAll() {
    const list = loadAll();
    renderTotals(list);
    renderShareBar(list);
    renderList(list);
    renderInsight(list);
  }

  function addSub() {
    const name = document.getElementById("nameInput").value.trim();
    const amountRaw = document.getElementById("amountInput").value;
    const amount = Math.round(Number(amountRaw));
    const hint = document.getElementById("formHint");

    if (!name) { hint.textContent = "サービス名を入れてください。"; hint.style.color = "var(--warn)"; return; }
    if (!amountRaw || isNaN(amount) || amount <= 0) {
      hint.textContent = "料金を正しく入れてください。"; hint.style.color = "var(--warn)"; return;
    }

    const list = loadAll();
    list.push({
      id: `${Date.now()}-${Math.floor(Math.random() * 1000)}`,
      name, amount, cycle: selectedCycle, category: selectedCat,
    });
    saveAll(list);

    document.getElementById("nameInput").value = "";
    document.getElementById("amountInput").value = "";
    hint.textContent = "棚に足しました。";
    hint.style.color = "var(--ink-faint)";
    renderAll();
    document.getElementById("nameInput").focus();
  }

  // ---- イベント ----
  document.getElementById("addBtn").addEventListener("click", addSub);
  document.getElementById("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") addSub(); });
  document.getElementById("amountInput").addEventListener("keydown", e => { if (e.key === "Enter") addSub(); });
  document.getElementById("cycleToggle").addEventListener("click", e => {
    const btn = e.target.closest("button"); if (!btn) return;
    selectedCycle = btn.getAttribute("data-cycle");
    [...document.querySelectorAll("#cycleToggle button")].forEach(b =>
      b.classList.toggle("on", b === btn));
  });

  // ---- 起動 ----
  renderCats();
  renderAll();
</script>
</body>
</html>
