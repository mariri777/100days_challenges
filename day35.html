<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かしかり帖 — 貸し借りの台帳</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#f2efe6;--bg2:#e9e4d7;
    --paper:#fffdf7;
    --ink:#35302a;--sub:#8e8676;
    --line:#e6ddcd;
    --accent:#8a6b47;--accent-deep:#6f5537;--accent-bg:#f1e9db;
    --lend:#4e7c74;--lend-bg:#e4efec;
    --borrow:#b0714e;--borrow-bg:#f4e8df;
    --done:#a9a291;
    --danger:#b0685c;
    --shadow:rgba(90,70,40,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden}
  body{
    font-family:"Zen Kaku Gothic New",sans-serif;
    background:radial-gradient(1100px 560px at 50% -8%, #f8f5ec 0%, var(--bg1) 48%, var(--bg2) 100%);
    color:var(--ink);line-height:1.75;min-height:100vh;
    padding:0 18px 56px;-webkit-font-smoothing:antialiased;
  }
  .mincho{font-family:"Shippori Mincho B1",serif;}
  .wrap{max-width:600px;margin:0 auto;}

  header{text-align:center;padding:46px 0 18px;}
  .kicker{font-size:.72rem;letter-spacing:.34em;color:var(--accent);font-weight:500;margin-bottom:15px;text-indent:.34em;}
  h1{font-family:"Shippori Mincho B1",serif;font-weight:600;font-size:2.05rem;letter-spacing:.12em;margin-bottom:11px;}
  .lead{font-size:.87rem;color:var(--sub);letter-spacing:.03em;}

  /* ---- summary ---- */
  .summary{display:flex;gap:12px;margin-bottom:20px;}
  .sum{
    flex:1;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:15px 16px;text-align:center;
    box-shadow:0 12px 28px -22px var(--shadow);
  }
  .sum .lb{font-size:.74rem;letter-spacing:.06em;color:var(--sub);margin-bottom:5px;}
  .sum .vv{font-family:"Shippori Mincho B1",serif;font-size:1.7rem;line-height:1;font-weight:600;}
  .sum .vv small{font-size:.8rem;font-family:"Zen Kaku Gothic New";color:var(--sub);margin-left:3px;font-weight:400;}
  .sum.lend .vv{color:var(--lend);}
  .sum.borrow .vv{color:var(--borrow);}

  /* ---- add form ---- */
  .form{
    background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:22px;
    box-shadow:0 16px 36px -26px var(--shadow);
  }
  .dir-toggle{display:flex;gap:8px;margin-bottom:15px;}
  .dir-toggle button{
    flex:1;font-family:inherit;font-size:.92rem;font-weight:500;padding:11px;border-radius:12px;cursor:pointer;transition:.16s;letter-spacing:.04em;
    border:1px solid var(--line);background:#fbf7ee;color:var(--sub);
  }
  .dir-toggle button[data-on="true"].lend{background:var(--lend);border-color:var(--lend);color:#fff;}
  .dir-toggle button[data-on="true"].borrow{background:var(--borrow);border-color:var(--borrow);color:#fff;}

  .row{display:flex;gap:10px;margin-bottom:11px;}
  .row.two > *{flex:1;min-width:0;}
  .fld{display:flex;flex-direction:column;gap:5px;}
  .fld label{font-size:.72rem;color:var(--sub);letter-spacing:.05em;padding-left:2px;}
  .fld input,.fld textarea{
    font-family:inherit;font-size:.95rem;color:var(--ink);padding:11px 13px;
    border:1px solid var(--line);border-radius:11px;background:#fbf8f1;letter-spacing:.02em;width:100%;
  }
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent);background:#fff;}
  .fld input::placeholder,.fld textarea::placeholder{color:#c1b8a5;}
  .fld textarea{resize:none;line-height:1.6;}
  .addBtn{
    width:100%;font-family:"Shippori Mincho B1",serif;font-size:1rem;letter-spacing:.12em;font-weight:500;
    color:#fff;background:linear-gradient(135deg,#9a794f,var(--accent-deep));border:none;border-radius:13px;padding:14px;cursor:pointer;margin-top:5px;
    box-shadow:0 12px 24px -13px rgba(120,90,50,.6);transition:.16s;
  }
  .addBtn:hover{transform:translateY(-1px);}
  .addBtn:active{transform:translateY(0);}

  /* ---- filters ---- */
  .filters{display:flex;gap:7px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
  .filters .ft{
    font-family:inherit;font-size:.82rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper);color:var(--sub);cursor:pointer;transition:.15s;letter-spacing:.03em;
  }
  .filters .ft:hover{border-color:var(--accent);color:var(--ink);}
  .filters .ft[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#f4efe4;font-weight:500;}
  .filters .spacer{flex:1;}
  .filters .toggle{font-size:.78rem;color:var(--sub);display:flex;align-items:center;gap:6px;cursor:pointer;letter-spacing:.02em;user-select:none;}
  .filters .toggle input{accent-color:var(--accent);width:15px;height:15px;}

  /* ---- list ---- */
  ul.list{list-style:none;display:flex;flex-direction:column;gap:11px;}
  li.entry{
    background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:15px 16px;
    display:flex;gap:13px;align-items:flex-start;box-shadow:0 10px 26px -24px var(--shadow);transition:.18s;
  }
  li.entry.returned{opacity:.62;background:#faf8f2;}
  .badge{
    flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-family:"Shippori Mincho B1",serif;font-size:1.15rem;font-weight:600;
  }
  .badge.lend{background:var(--lend-bg);color:var(--lend);}
  .badge.borrow{background:var(--borrow-bg);color:var(--borrow);}
  .entry.returned .badge{background:#eee9df;color:var(--done);}
  .body{flex:1;min-width:0;}
  .item-name{font-family:"Shippori Mincho B1",serif;font-size:1.08rem;letter-spacing:.02em;word-break:break-word;}
  .entry.returned .item-name{text-decoration:line-through;text-decoration-color:#cfc7b5;color:var(--done);}
  .meta{font-size:.8rem;color:var(--sub);margin-top:3px;letter-spacing:.02em;}
  .meta .who{color:var(--ink);}
  .entry.returned .meta .who{color:var(--done);}
  .memo{font-size:.8rem;color:var(--sub);margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);letter-spacing:.02em;word-break:break-word;}
  .actions{flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .ret{
    font-family:inherit;font-size:.74rem;padding:6px 11px;border-radius:9px;cursor:pointer;transition:.15s;letter-spacing:.03em;white-space:nowrap;
    border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent-deep);font-weight:500;
  }
  .ret:hover{background:var(--accent);color:#fff;}
  .entry.returned .ret{border-color:var(--line);background:#f3efe6;color:var(--sub);font-weight:400;}
  .del{border:none;background:transparent;color:#cbc3b2;cursor:pointer;font-size:1.05rem;line-height:1;padding:2px 6px;border-radius:7px;transition:.14s;}
  .del:hover{background:#f6e9e6;color:var(--danger);}

  .empty{text-align:center;color:var(--sub);font-size:.85rem;padding:34px 12px;border:1px dashed var(--line);border-radius:15px;background:#fdfaf3;letter-spacing:.04em;}
  .empty .mk{font-family:"Shippori Mincho B1",serif;font-size:1.5rem;color:#cabfa6;display:block;margin-bottom:8px;}

  .backlink{text-align:center;margin-top:32px;}
  .backlink a{color:var(--sub);font-size:.78rem;text-decoration:none;letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:2px;}
  .backlink a:hover{color:var(--accent);}

  @media (max-width:640px){
    header{padding:34px 0 14px;}
    h1{font-size:1.7rem;}
    .row.two{flex-direction:column;gap:11px;}
    .badge{width:34px;height:34px;font-size:1.05rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">LEND &amp; BORROW LEDGER</div>
    <h1 class="mincho">かしかり帖</h1>
    <p class="lead">貸したもの、借りたもの。返し忘れを、なくす。</p>
  </header>

  <div class="summary">
    <div class="sum lend"><div class="lb">貸している</div><div class="vv"><span id="lendN">0</span><small>件</small></div></div>
    <div class="sum borrow"><div class="lb">借りている</div><div class="vv"><span id="borrowN">0</span><small>件</small></div></div>
  </div>

  <div class="form">
    <div class="dir-toggle">
      <button type="button" class="lend" id="dirLend" data-on="true">貸した</button>
      <button type="button" class="borrow" id="dirBorrow" data-on="false">借りた</button>
    </div>
    <div class="fld" style="margin-bottom:11px;">
      <label for="fItem">何を</label>
      <input id="fItem" type="text" maxlength="40" placeholder="例：本『銀河鉄道の夜』／3,000円／折りたたみ傘" autocomplete="off">
    </div>
    <div class="row two">
      <div class="fld"><label for="fPerson">だれと</label><input id="fPerson" type="text" maxlength="20" placeholder="例：田中さん" autocomplete="off"></div>
      <div class="fld"><label for="fDate">いつ</label><input id="fDate" type="date"></div>
    </div>
    <div class="fld" style="margin:11px 0 3px;">
      <label for="fMemo">メモ（任意）</label>
      <input id="fMemo" type="text" maxlength="60" placeholder="例：来月の飲み会で返す" autocomplete="off">
    </div>
    <button class="addBtn mincho" id="addBtn">台帳に書く</button>
  </div>

  <div class="filters">
    <button class="ft" id="fAll" aria-pressed="true">すべて</button>
    <button class="ft" id="fLend" aria-pressed="false">貸した</button>
    <button class="ft" id="fBorrow" aria-pressed="false">借りた</button>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="onlyUnreturned">未返却のみ</label>
  </div>

  <ul class="list" id="list"></ul>

  <div class="backlink"><a href="index.html">← 100 Days Challenge にもどる</a></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const KEY = 'kashikari_v1';

  let store, filter='all', onlyUn=false, dir='lend';

  function todayStr(){
    const d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function load(){
    try{ store = JSON.parse(localStorage.getItem(KEY)); }catch(e){ store=null; }
    if(!store || !Array.isArray(store.entries)){
      store = { entries: [
        {id:1, dir:'lend',   item:'本『夜のピクニック』', person:'ゆかさん', date:daysAgo(12), memo:'読み終わったら感想を聞く', returned:false},
        {id:2, dir:'borrow', item:'モバイルバッテリー', person:'兄',       date:daysAgo(3),  memo:'', returned:false},
      ], seq:3 };
      save();
    }
    if(!store.seq) store.seq = Math.max(0,...store.entries.map(e=>e.id||0))+1;
  }
  function daysAgo(n){
    const d=new Date(); d.setDate(d.getDate()-n);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(store)); }

  // direction toggle
  $('dirLend').onclick=()=>setDir('lend');
  $('dirBorrow').onclick=()=>setDir('borrow');
  function setDir(d){
    dir=d;
    $('dirLend').dataset.on = (d==='lend');
    $('dirBorrow').dataset.on = (d==='borrow');
  }

  // filters
  function setFilter(f){
    filter=f;
    $('fAll').setAttribute('aria-pressed', f==='all');
    $('fLend').setAttribute('aria-pressed', f==='lend');
    $('fBorrow').setAttribute('aria-pressed', f==='borrow');
    render();
  }
  $('fAll').onclick=()=>setFilter('all');
  $('fLend').onclick=()=>setFilter('lend');
  $('fBorrow').onclick=()=>setFilter('borrow');
  $('onlyUnreturned').onchange=e=>{ onlyUn=e.target.checked; render(); };

  // add
  $('addBtn').onclick=()=>{
    const item=$('fItem').value.trim();
    const person=$('fPerson').value.trim();
    const date=$('fDate').value || todayStr();
    const memo=$('fMemo').value.trim();
    if(!item){ flash($('fItem')); return; }
    if(!person){ flash($('fPerson')); return; }
    store.entries.push({id:store.seq++, dir, item, person, date, memo, returned:false});
    save();
    $('fItem').value=''; $('fPerson').value=''; $('fMemo').value=''; $('fDate').value=todayStr();
    render();
  };
  function flash(el){
    el.style.borderColor='var(--danger)';
    el.focus();
    setTimeout(()=>{ el.style.borderColor=''; }, 1200);
  }

  function elapsed(dateStr){
    const p=dateStr.split('-').map(Number);
    const then=new Date(p[0],p[1]-1,p[2]);
    const now=new Date(); const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const diff=Math.round((today-then)/86400000);
    if(diff<0) return null;
    if(diff===0) return '今日';
    if(diff===1) return '昨日';
    return diff+'日前';
  }
  function fmtDate(dateStr){
    const p=dateStr.split('-');
    return p[0]+'.'+p[1]+'.'+p[2];
  }

  function render(){
    // counts (未返却のみ)
    const un = store.entries.filter(e=>!e.returned);
    $('lendN').textContent = un.filter(e=>e.dir==='lend').length;
    $('borrowN').textContent = un.filter(e=>e.dir==='borrow').length;

    let list = store.entries.slice();
    if(filter!=='all') list = list.filter(e=>e.dir===filter);
    if(onlyUn) list = list.filter(e=>!e.returned);
    // sort: 未返却が先、そのなかで日付が古い順（返し忘れが上に来る）／返却済みは日付が新しい順
    list.sort((a,b)=>{
      if(a.returned!==b.returned) return a.returned?1:-1;
      return a.returned ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date);
    });

    const ul=$('list'); ul.innerHTML='';
    if(list.length===0){
      const li=document.createElement('li');
      li.className='empty';
      li.innerHTML='<span class="mk">帖</span>まだ記録がありません。<br>上のフォームから書き入れてください。';
      ul.appendChild(li);
      return;
    }

    list.forEach(e=>{
      const li=document.createElement('li');
      li.className='entry'+(e.returned?' returned':'');

      const badge=document.createElement('div');
      badge.className='badge '+e.dir;
      badge.textContent = e.dir==='lend'?'貸':'借';

      const body=document.createElement('div'); body.className='body';
      const name=document.createElement('div'); name.className='item-name'; name.textContent=e.item;
      const meta=document.createElement('div'); meta.className='meta';
      const rel = e.dir==='lend' ? 'に貸した' : 'から借りた';
      const el = elapsed(e.date);
      meta.innerHTML = `<span class="who">${escapeHtml(e.person)}</span>${rel}・${fmtDate(e.date)}` + (el?`（${el}）`:'');
      body.append(name, meta);
      if(e.memo){
        const memo=document.createElement('div'); memo.className='memo'; memo.textContent=e.memo;
        body.append(memo);
      }

      const actions=document.createElement('div'); actions.className='actions';
      const ret=document.createElement('button'); ret.className='ret';
      ret.textContent = e.returned ? '戻す' : (e.dir==='lend'?'返してもらった':'返した');
      ret.onclick=()=>{ e.returned=!e.returned; save(); render(); };
      const del=document.createElement('button'); del.className='del'; del.textContent='×'; del.setAttribute('aria-label','削除');
      del.onclick=()=>{
        if(confirm('この記録を削除します。よろしいですか？')){
          store.entries = store.entries.filter(x=>x.id!==e.id); save(); render();
        }
      };
      actions.append(ret, del);

      li.append(badge, body, actions);
      ul.appendChild(li);
    });
  }
  function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

  // init
  load();
  $('fDate').value = todayStr();
  setDir('lend');
  render();
</script>
</body>
</html>
