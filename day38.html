<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>きろく献立帳 — 今週すでにカレー2回、に気づく</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --bg: #f4eee2;
    --bg-soft: #faf6ee;
    --panel: #fffdf8;
    --ink: #3b362d;
    --ink-soft: #786f60;
    --ink-faint: #a79c88;
    --line: #e5dbc8;
    --line-soft: #f0e9da;
    --accent: #7d8a5c;
    --accent-deep: #6a774b;
    --warn: #bb6a4c;
    --shadow: 0 18px 40px -24px rgba(80, 70, 45, 0.34);
    --radius: 18px;

    /* ジャンル色（ニュアンストーン） */
    --g-wa:   #8a9a5b;
    --g-yo:   #c99a5b;
    --g-chu:  #b3654e;
    --g-men:  #c2a878;
    --g-don:  #c2914e;
    --g-nabe: #7d95a6;
    --g-etc:  #a89c8d;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: "Zen Kaku Gothic New", sans-serif;
    background:
      radial-gradient(1100px 560px at 82% -12%, #f7efe0 0%, transparent 55%),
      radial-gradient(880px 480px at -10% 8%, #eee6d5 0%, transparent 52%),
      var(--bg);
    color: var(--ink);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap { max-width: 820px; margin: 0 auto; padding: 56px 24px 96px; }

  /* ---- ヘッダー ---- */
  header.masthead { text-align: center; margin-bottom: 40px; }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.42em;
    color: var(--ink-faint); text-indent: 0.42em; margin-bottom: 18px;
  }
  h1 {
    font-family: "Shippori Mincho", serif; font-weight: 700;
    font-size: clamp(30px, 6vw, 44px); letter-spacing: 0.08em;
    margin: 0 0 14px; color: var(--ink);
  }
  .lead { font-size: 14.5px; color: var(--ink-soft); max-width: 30em; margin: 0 auto; }
  .masthead .rule { width: 40px; height: 1px; background: var(--accent); margin: 24px auto 0; opacity: 0.6; }

  /* ---- パネル ---- */
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 26px; margin-bottom: 22px;
  }
  .panel-title {
    font-family: "Shippori Mincho", serif; font-size: 16px; letter-spacing: 0.08em;
    margin: 0 0 20px; display: flex; align-items: center; gap: 10px; color: var(--ink);
  }
  .panel-title::before {
    content: ""; width: 5px; height: 16px; border-radius: 3px;
    background: var(--accent); opacity: 0.7;
  }

  /* ---- 入力フォーム ---- */
  .form-grid { display: grid; grid-template-columns: auto 1fr; gap: 14px 16px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-faint); }
  input[type="date"], input[type="text"] {
    font-family: "Zen Kaku Gothic New", sans-serif; font-size: 15px; color: var(--ink);
    background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; outline: none; transition: border-color 0.2s ease; width: 100%;
  }
  input[type="date"] { width: 168px; }
  input:focus { border-color: var(--accent); }

  .genre-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .genre-chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: var(--bg-soft); border-radius: 999px;
    padding: 7px 14px 7px 11px; font-size: 13px; color: var(--ink-soft);
    cursor: pointer; transition: all 0.18s ease;
  }
  .genre-chip .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .genre-chip:hover { border-color: var(--ink-faint); }
  .genre-chip.selected { color: var(--ink); border-color: var(--ink); background: #fff; font-weight: 500; }

  .form-actions { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; margin-top: 4px; }
  .btn-add {
    font-family: "Zen Kaku Gothic New", sans-serif; font-size: 14px; letter-spacing: 0.06em;
    color: #fff; background: var(--accent); border: none; border-radius: 10px;
    padding: 12px 26px; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease;
  }
  .btn-add:hover { background: var(--accent-deep); }
  .btn-add:active { transform: translateY(1px); }
  .form-hint { font-size: 12px; color: var(--ink-faint); }

  /* ---- 気づき（かぶり） ---- */
  .insight {
    background: linear-gradient(180deg, #fbf4e9, #fdf9f1);
    border: 1px solid #ecdcc2;
  }
  .insight .panel-title::before { background: var(--warn); }
  .notice {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px; border-radius: 12px; background: #fff6ec;
    border: 1px solid #f0dcc0; margin-bottom: 10px; font-size: 14px; color: var(--ink);
  }
  .notice:last-child { margin-bottom: 0; }
  .notice .mark {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%;
    background: var(--warn); color: #fff; font-size: 13px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .notice b { font-family: "Shippori Mincho", serif; font-weight: 700; }
  .insight-none {
    font-size: 13.5px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 10px;
  }
  .insight-none .mark {
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .rank { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .rank .tag {
    font-size: 12.5px; color: var(--ink-soft); background: var(--bg-soft);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
  }
  .rank .tag b { color: var(--ink); font-weight: 700; }
  .rank-label { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-faint); margin-bottom: 8px; }

  /* ---- 週ビュー ---- */
  .weeknav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
  .weeknav button {
    border: 1px solid var(--line); background: var(--bg-soft); color: var(--ink-soft);
    width: 34px; height: 34px; border-radius: 50%; font-size: 15px; cursor: pointer;
    transition: all 0.2s ease; line-height: 1;
  }
  .weeknav button:hover { border-color: var(--accent); color: var(--accent); }
  .weeknav .range { font-family: "Shippori Mincho", serif; font-size: 15px; letter-spacing: 0.04em; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day {
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg-soft);
    padding: 10px 8px; min-height: 104px; cursor: pointer; transition: all 0.18s ease;
    display: flex; flex-direction: column; gap: 6px;
  }
  .day:hover { border-color: var(--accent); background: #fff; }
  .day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .day.selected { background: #fff; border-color: var(--ink); }
  .day .dnum { font-size: 12px; color: var(--ink-faint); display: flex; justify-content: space-between; }
  .day .dnum .wd { font-weight: 700; }
  .day .dnum .wd.sat { color: #6f88a6; }
  .day .dnum .wd.sun { color: #b5705f; }
  .day .meals { display: flex; flex-direction: column; gap: 4px; }
  .day .meal {
    font-size: 12px; line-height: 1.4; color: var(--ink);
    display: flex; align-items: flex-start; gap: 5px;
  }
  .day .meal .gd { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; }
  .day .meal.dup .txt { color: var(--warn); font-weight: 700; }
  .day .empty-dot { font-size: 12px; color: var(--ink-faint); }

  /* ---- 記録一覧 ---- */
  .entry-list { display: flex; flex-direction: column; }
  .entry {
    display: grid; grid-template-columns: auto auto 1fr auto; gap: 14px; align-items: center;
    padding: 13px 4px; border-bottom: 1px solid var(--line-soft);
  }
  .entry:last-child { border-bottom: none; }
  .entry .e-date { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  .entry .e-genre {
    font-size: 11px; color: #fff; border-radius: 6px; padding: 2px 8px; white-space: nowrap;
  }
  .entry .e-body .dish { font-size: 15px; color: var(--ink); }
  .entry .e-body .dish .flag { color: var(--warn); font-size: 12px; margin-left: 6px; font-weight: 700; }
  .entry .e-body .memo { font-size: 12.5px; color: var(--ink-soft); }
  .entry .del {
    border: none; background: transparent; color: var(--ink-faint); cursor: pointer;
    font-size: 18px; padding: 4px 8px; border-radius: 8px; transition: all 0.18s ease; line-height: 1;
  }
  .entry .del:hover { color: var(--warn); background: var(--line-soft); }

  .empty {
    text-align: center; color: var(--ink-faint); font-size: 13.5px; padding: 26px 10px;
  }
  .empty .mincho { font-family: "Shippori Mincho", serif; font-size: 15px; color: var(--ink-soft); }

  footer.credit { text-align: center; margin-top: 40px; font-size: 11px; letter-spacing: 0.18em; color: var(--ink-faint); }

  /* ---- レスポンシブ ---- */
  @media (max-width: 640px) {
    .wrap { padding: 40px 16px 80px; }
    .panel { padding: 20px 16px; }
    .form-grid { grid-template-columns: 1fr; }
    input[type="date"] { width: 100%; }
    .week { grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .day { min-height: 92px; padding: 7px 4px; border-radius: 9px; }
    .day .dnum { font-size: 10px; }
    .day .meal { font-size: 10.5px; }
    .day .meal .gd { width: 6px; height: 6px; }
    .weeknav .range { font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="eyebrow">DINNER LOG</div>
      <h1>きろく献立帳</h1>
      <p class="lead">きょうの夕飯を書き留めるだけ。<br />「今週すでにカレー2回」みたいな、かぶりにそっと気づける帳面です。</p>
      <div class="rule"></div>
    </header>

    <!-- 入力 -->
    <section class="panel">
      <h2 class="panel-title">献立をつける</h2>
      <div class="form-grid">
        <div class="field">
          <label>ひづけ</label>
          <input type="date" id="dateInput" />
        </div>
        <div class="field">
          <label>メインの料理</label>
          <input type="text" id="dishInput" placeholder="例：カレー / 焼き魚 / パスタ" maxlength="30" />
        </div>
        <div class="field full">
          <label>ジャンル</label>
          <div class="genre-row" id="genreRow"></div>
        </div>
        <div class="field full">
          <label>ひとことメモ（副菜など・任意）</label>
          <input type="text" id="memoInput" placeholder="例：サラダとみそ汁も / 作りおきの消費" maxlength="40" />
        </div>
        <div class="form-actions">
          <button class="btn-add" id="addBtn">帳面につける</button>
          <span class="form-hint" id="formHint">同じ日に何品つけてもOK</span>
        </div>
      </div>
    </section>

    <!-- 気づき -->
    <section class="panel insight">
      <h2 class="panel-title">最近のかぶり</h2>
      <div id="insightBody"></div>
      <div id="rankBox"></div>
    </section>

    <!-- 週ビュー -->
    <section class="panel">
      <h2 class="panel-title">今週のこんだて</h2>
      <div class="weeknav">
        <button id="prevWeek" aria-label="前の週">‹</button>
        <span class="range" id="weekRange">—</span>
        <button id="nextWeek" aria-label="次の週">›</button>
      </div>
      <div class="week" id="week"></div>
    </section>

    <!-- 記録一覧 -->
    <section class="panel">
      <h2 class="panel-title">これまでの記録</h2>
      <div class="entry-list" id="entryList"></div>
    </section>

    <footer class="credit">Built by usami_louis</footer>
  </div>

<script>
  "use strict";

  // ---- ジャンル定義 ----
  const GENRES = [
    { id: "wa",   name: "和",   color: "var(--g-wa)"   },
    { id: "yo",   name: "洋",   color: "var(--g-yo)"   },
    { id: "chu",  name: "中",   color: "var(--g-chu)"  },
    { id: "men",  name: "麺",   color: "var(--g-men)"  },
    { id: "don",  name: "丼・カレー", color: "var(--g-don)" },
    { id: "nabe", name: "鍋・汁", color: "var(--g-nabe)" },
    { id: "etc",  name: "その他", color: "var(--g-etc)" },
  ];
  const genreById = Object.fromEntries(GENRES.map(g => [g.id, g]));

  const STORE_KEY = "kondate-log-v1";
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  let selectedGenre = "wa";
  let selectedDate = new Date();   // フォームの対象日
  let weekAnchor = new Date();     // 週ビューの基準日

  // ---- データ ----
  function loadAll() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch { return []; }
  }
  function saveAll(list) { localStorage.setItem(STORE_KEY, JSON.stringify(list)); }

  // ---- 日付ユーティリティ ----
  function ymd(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function parseYmd(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function startOfWeek(d) {
    // 月曜はじまり
    const x = new Date(d);
    const diff = (x.getDay() + 6) % 7;
    return addDays(x, -diff);
  }
  function daysBetween(a, b) {
    return Math.round((parseYmd(a) - parseYmd(b)) / 86400000);
  }
  function normDish(s) { return s.trim().replace(/\s+/g, ""); }

  // ---- かぶり検出（直近14日） ----
  function computeRepeats() {
    const all = loadAll();
    const today = ymd(new Date());
    const counts = {};   // 表示名 -> {count, dates:[], genre}
    all.forEach(e => {
      const diff = daysBetween(today, e.date);
      if (diff < 0 || diff > 13) return;      // 今日から過去14日ぶん
      const key = normDish(e.dish);
      if (!key) return;
      if (!counts[key]) counts[key] = { label: e.dish.trim(), count: 0, dates: [], genre: e.genre };
      counts[key].count++;
      counts[key].dates.push(e.date);
    });
    return counts;
  }

  // ---- 描画 ----
  function renderGenres() {
    const row = document.getElementById("genreRow");
    row.innerHTML = "";
    GENRES.forEach(g => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "genre-chip" + (g.id === selectedGenre ? " selected" : "");
      chip.innerHTML = `<span class="dot" style="background:${g.color}"></span>${g.name}`;
      chip.addEventListener("click", () => { selectedGenre = g.id; renderGenres(); });
      row.appendChild(chip);
    });
  }

  function renderInsight() {
    const counts = computeRepeats();
    const repeats = Object.values(counts)
      .filter(c => c.count >= 2)
      .sort((a, b) => b.count - a.count);

    const body = document.getElementById("insightBody");
    body.innerHTML = "";

    if (repeats.length === 0) {
      body.innerHTML =
        `<div class="insight-none"><span class="mark">✓</span>` +
        `この2週間、同じ料理のかぶりはありません。いい感じにバラけています。</div>`;
    } else {
      repeats.forEach(c => {
        const div = document.createElement("div");
        div.className = "notice";
        div.innerHTML =
          `<span class="mark">!</span>` +
          `<span>この2週間で <b>「${escapeHtml(c.label)}」</b> が <b>${c.count}回</b> 登場しています。</span>`;
        body.appendChild(div);
      });
    }

    // 登場ランキング
    const ranked = Object.values(counts).sort((a, b) => b.count - a.count).slice(0, 6);
    const box = document.getElementById("rankBox");
    if (ranked.length === 0) { box.innerHTML = ""; return; }
    box.innerHTML =
      `<div class="rank-label">この2週間の登場回数</div>` +
      `<div class="rank">` +
      ranked.map(c => `<span class="tag">${escapeHtml(c.label)} <b>${c.count}</b></span>`).join("") +
      `</div>`;
  }

  function renderWeek() {
    const start = startOfWeek(weekAnchor);
    const end = addDays(start, 6);
    document.getElementById("weekRange").textContent =
      `${start.getMonth() + 1}/${start.getDate()} 〜 ${end.getMonth() + 1}/${end.getDate()}`;

    const all = loadAll();
    const counts = computeRepeats();
    const todayStr = ymd(new Date());
    const week = document.getElementById("week");
    week.innerHTML = "";

    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i);
      const ds = ymd(d);
      const cell = document.createElement("div");
      cell.className = "day";
      if (ds === todayStr) cell.classList.add("today");
      if (ds === ymd(selectedDate)) cell.classList.add("selected");

      const wdClass = i === 5 ? "sat" : (i === 6 ? "sun" : "");
      const meals = all.filter(e => e.date === ds);
      const mealsHtml = meals.length
        ? `<div class="meals">` + meals.map(e => {
            const g = genreById[e.genre] || genreById.etc;
            const dup = (counts[normDish(e.dish)] || {}).count >= 2;
            return `<span class="meal${dup ? " dup" : ""}">` +
                   `<span class="gd" style="background:${g.color}"></span>` +
                   `<span class="txt">${escapeHtml(e.dish)}</span></span>`;
          }).join("") + `</div>`
        : `<div class="empty-dot">·</div>`;

      cell.innerHTML =
        `<div class="dnum"><span>${d.getDate()}</span>` +
        `<span class="wd ${wdClass}">${WD[d.getDay()]}</span></div>` +
        mealsHtml;

      cell.addEventListener("click", () => {
        selectedDate = d;
        document.getElementById("dateInput").value = ds;
        renderWeek();
      });
      week.appendChild(cell);
    }
  }

  function renderEntries() {
    const all = loadAll().slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    const counts = computeRepeats();
    const list = document.getElementById("entryList");
    list.innerHTML = "";
    if (all.length === 0) {
      list.innerHTML = `<div class="empty"><span class="mincho">まだ、献立帳は白紙です。</span></div>`;
      return;
    }
    all.slice(0, 40).forEach(e => {
      const g = genreById[e.genre] || genreById.etc;
      const d = parseYmd(e.date);
      const dup = (counts[normDish(e.dish)] || {}).count >= 2;
      const row = document.createElement("div");
      row.className = "entry";
      row.innerHTML =
        `<span class="e-date">${e.date.slice(5).replace("-", "/")}（${WD[d.getDay()]}）</span>` +
        `<span class="e-genre" style="background:${g.color}">${g.name}</span>` +
        `<span class="e-body"><span class="dish">${escapeHtml(e.dish)}` +
        (dup ? `<span class="flag">最近かぶり</span>` : ``) + `</span>` +
        (e.memo ? `<span class="memo">${escapeHtml(e.memo)}</span>` : ``) + `</span>` +
        `<button class="del" title="削除" data-id="${e.id}">×</button>`;
      list.appendChild(row);
    });
    list.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-id");
        saveAll(loadAll().filter(e => e.id !== id));
        renderAll();
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  function renderAll() {
    renderInsight();
    renderWeek();
    renderEntries();
  }

  // ---- 追加 ----
  function addEntry() {
    const date = document.getElementById("dateInput").value;
    const dish = document.getElementById("dishInput").value.trim();
    const memo = document.getElementById("memoInput").value.trim();
    const hint = document.getElementById("formHint");

    if (!date) { hint.textContent = "日付を選んでください。"; hint.style.color = "var(--warn)"; return; }
    if (!dish) { hint.textContent = "メインの料理を入れてください。"; hint.style.color = "var(--warn)"; return; }

    const all = loadAll();
    all.push({
      id: `${Date.now()}-${Math.floor(Math.random() * 1000)}`,
      date, dish, genre: selectedGenre, memo,
    });
    saveAll(all);

    document.getElementById("dishInput").value = "";
    document.getElementById("memoInput").value = "";
    selectedDate = parseYmd(date);
    weekAnchor = parseYmd(date);
    hint.textContent = "帳面につけました。";
    hint.style.color = "var(--ink-faint)";
    renderAll();
    document.getElementById("dishInput").focus();
  }

  // ---- イベント ----
  document.getElementById("addBtn").addEventListener("click", addEntry);
  document.getElementById("dishInput").addEventListener("keydown", e => { if (e.key === "Enter") addEntry(); });
  document.getElementById("memoInput").addEventListener("keydown", e => { if (e.key === "Enter") addEntry(); });
  document.getElementById("dateInput").addEventListener("change", e => {
    if (e.target.value) { selectedDate = parseYmd(e.target.value); weekAnchor = parseYmd(e.target.value); renderWeek(); }
  });
  document.getElementById("prevWeek").addEventListener("click", () => { weekAnchor = addDays(startOfWeek(weekAnchor), -7); renderWeek(); });
  document.getElementById("nextWeek").addEventListener("click", () => { weekAnchor = addDays(startOfWeek(weekAnchor), 7); renderWeek(); });

  // ---- 起動 ----
  document.getElementById("dateInput").value = ymd(selectedDate);
  renderGenres();
  renderAll();
</script>
</body>
</html>
