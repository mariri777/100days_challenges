<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>何食べる？ルーレット — 決められない夜に、クルクル</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --bg: #fdf5ec;
    --bg-2: #fbeede;
    --card: #fffaf3;
    --ink: #4b3b31;
    --ink-soft: #927b6b;
    --ink-faint: #bda894;
    --line: #efe1d1;
    --accent: #e07a53;
    --accent-deep: #c8623c;
    --shadow: 0 20px 44px -24px rgba(120, 70, 40, 0.45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: "Zen Maru Gothic", sans-serif;
    background:
      radial-gradient(1100px 560px at 82% -14%, #ffe9d6 0%, transparent 55%),
      radial-gradient(900px 500px at -8% 108%, #ffe0e0 0%, transparent 52%),
      var(--bg);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 52px 22px 100px; text-align: center; }

  /* ---- ヘッダー ---- */
  .eyebrow {
    font-size: 12px; letter-spacing: 0.3em; color: var(--ink-faint);
    font-weight: 500; margin-bottom: 10px;
  }
  h1 {
    font-weight: 900; font-size: clamp(28px, 7vw, 40px);
    letter-spacing: 0.02em; margin: 0 0 8px; color: var(--ink);
  }
  .lead { font-size: 14px; color: var(--ink-soft); margin: 0 0 26px; }

  /* ---- 結果表示 ---- */
  .result {
    min-height: 58px; margin-bottom: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .result .pre { font-size: 13px; color: var(--ink-soft); }
  .result .big {
    font-weight: 900; font-size: clamp(26px, 8vw, 40px); color: var(--accent-deep);
    line-height: 1.2;
  }
  .result.pop .big { animation: pop 0.5s cubic-bezier(.18,.9,.3,1.4); }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

  /* ---- ルーレット ---- */
  .wheel-area { position: relative; width: min(340px, 86vw); margin: 6px auto 4px; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 5;
    border-left: 15px solid transparent; border-right: 15px solid transparent;
    border-top: 26px solid var(--accent);
    filter: drop-shadow(0 3px 3px rgba(120,70,40,0.3));
  }
  .wheel-shell {
    border-radius: 50%; padding: 10px; background: var(--card);
    box-shadow: var(--shadow), 0 0 0 6px #fff inset;
  }
  #wheel {
    width: 100%; height: auto; display: block; border-radius: 50%;
    transition: transform 4.4s cubic-bezier(0.12, 0.72, 0.12, 1);
  }
  .hub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 62px; height: 62px; border-radius: 50%; z-index: 4;
    background: #fff; box-shadow: 0 4px 12px -4px rgba(120,70,40,0.5);
    border: none; cursor: pointer; color: var(--accent-deep);
    font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 15px;
    transition: transform 0.12s ease;
  }
  .hub:hover { transform: translate(-50%, -50%) scale(1.06); }
  .hub:active { transform: translate(-50%, -50%) scale(0.96); }
  .hub:disabled { color: var(--ink-faint); cursor: default; }

  .btn-spin {
    margin-top: 20px; font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700; font-size: 17px; color: #fff; background: var(--accent);
    border: none; border-radius: 999px; padding: 13px 44px; cursor: pointer;
    box-shadow: 0 10px 20px -10px rgba(200,98,60,0.9); transition: all 0.16s ease;
  }
  .btn-spin:hover { background: var(--accent-deep); }
  .btn-spin:active { transform: translateY(2px); }
  .btn-spin:disabled { background: var(--ink-faint); box-shadow: none; cursor: default; }

  /* ---- 選択肢エディタ ---- */
  .editor {
    margin-top: 40px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 22px; text-align: left; box-shadow: var(--shadow);
  }
  .editor h2 {
    font-size: 15px; font-weight: 700; margin: 0 0 6px; color: var(--ink);
  }
  .editor .sub { font-size: 12px; color: var(--ink-faint); margin: 0 0 16px; }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .preset {
    font-family: "Zen Maru Gothic", sans-serif; font-size: 12.5px; color: var(--ink-soft);
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; cursor: pointer; transition: all 0.15s ease;
  }
  .preset:hover { border-color: var(--accent); color: var(--accent-deep); }

  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .opt {
    display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 8px 7px 14px;
  }
  .opt .cdot { width: 10px; height: 10px; border-radius: 50%; }
  .opt .x {
    border: none; background: transparent; color: var(--ink-faint); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 2px 5px; border-radius: 50%; transition: all 0.15s ease;
  }
  .opt .x:hover { color: #fff; background: var(--accent); }

  .add-row { display: flex; gap: 10px; }
  .add-row input {
    flex: 1; font-family: "Zen Maru Gothic", sans-serif; font-size: 15px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none;
    transition: border-color 0.18s ease;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button {
    font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 15px; color: #fff;
    background: var(--accent); border: none; border-radius: 10px; padding: 0 20px; cursor: pointer;
    transition: background 0.18s ease;
  }
  .add-row button:hover { background: var(--accent-deep); }
  .hint { font-size: 12px; color: var(--ink-faint); margin: 12px 2px 0; }

  footer.credit {
    margin-top: 46px; font-size: 11px; letter-spacing: 0.14em; color: var(--ink-faint);
  }

  @media (max-width: 640px) {
    .wrap { padding: 38px 16px 84px; }
    .editor { padding: 18px 16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">WHAT TO EAT?</div>
    <h1>何食べる？ルーレット</h1>
    <p class="lead">決められない夜に。クルクル回して、えいっと決めちゃおう。</p>

    <div class="result" id="result">
      <span class="pre">ボタンかまん中をタップで回るよ</span>
    </div>

    <div class="wheel-area">
      <div class="pointer"></div>
      <div class="wheel-shell">
        <svg id="wheel" viewBox="0 0 300 300" aria-label="ルーレット"></svg>
      </div>
      <button class="hub" id="hub">回す</button>
    </div>

    <button class="btn-spin" id="spinBtn">スピン！</button>

    <!-- 選択肢エディタ -->
    <section class="editor">
      <h2>選択肢を編集</h2>
      <p class="sub">2つ以上あれば回せます。プリセットからも選べます。</p>

      <div class="presets" id="presets"></div>

      <div class="opts" id="opts"></div>

      <div class="add-row">
        <input type="text" id="optInput" placeholder="選択肢を追加…（例：焼肉）" maxlength="16" />
        <button id="addOpt">追加</button>
      </div>
      <p class="hint" id="hint">最大12個まで登録できます</p>
    </section>

    <footer class="credit">Built by usami_louis</footer>
  </div>

<script>
  "use strict";

  const PALETTE = [
    "#e0896f", "#e6b45c", "#cbbf6a", "#9db877", "#7fb0a3", "#7aa0c4",
    "#9b8fc0", "#c58bb0", "#d98a8a", "#c9a06a", "#8fbf9a", "#b0a58f"
  ];
  const PRESETS = {
    "夕飯セット": ["カレー", "パスタ", "焼き魚", "丼もの", "鍋", "冷蔵庫のこり"],
    "ランチセット": ["ラーメン", "定食", "そば・うどん", "パン", "おにぎり", "サラダ"],
    "外食ジャンル": ["和食", "イタリアン", "中華", "焼肉", "カフェ", "居酒屋"],
    "自炊 or 外": ["自炊する", "買って帰る", "外で食べる", "デリバリー"],
  };
  const DEFAULT_OPTS = ["カレー", "パスタ", "外食", "冷蔵庫のこり", "ラーメン", "丼もの"];
  const MAX = 12;

  const STORE_KEY = "eat-roulette-v1";
  let options = load();
  let rotation = 0;
  let spinning = false;

  function load() {
    try {
      const v = JSON.parse(localStorage.getItem(STORE_KEY));
      if (Array.isArray(v) && v.length) return v.slice(0, MAX);
    } catch {}
    return DEFAULT_OPTS.slice();
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(options)); }

  const CX = 150, CY = 150, R = 146;
  function polar(angleDeg, r) {
    const t = (angleDeg - 90) * Math.PI / 180;  // 0度を上に
    return [CX + r * Math.cos(t), CY + r * Math.sin(t)];
  }

  function renderWheel() {
    const svg = document.getElementById("wheel");
    const n = options.length;
    svg.innerHTML = "";
    if (n === 0) return;

    const seg = 360 / n;
    for (let i = 0; i < n; i++) {
      const a0 = i * seg, a1 = (i + 1) * seg;
      const [x0, y0] = polar(a0, R);
      const [x1, y1] = polar(a1, R);
      const large = seg > 180 ? 1 : 0;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${CX} ${CY} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`);
      path.setAttribute("fill", PALETTE[i % PALETTE.length]);
      path.setAttribute("stroke", "#fffaf3");
      path.setAttribute("stroke-width", "2");
      svg.appendChild(path);

      // ラベル
      const mid = a0 + seg / 2;
      const [lx, ly] = polar(mid, R * 0.64);
      const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x", lx.toFixed(2));
      txt.setAttribute("y", ly.toFixed(2));
      txt.setAttribute("fill", "#fff");
      txt.setAttribute("font-size", n > 8 ? "12" : "14");
      txt.setAttribute("font-weight", "700");
      txt.setAttribute("text-anchor", "middle");
      txt.setAttribute("dominant-baseline", "central");
      // 下半分のラベルは上下反転して読みやすく
      const rot = (mid > 90 && mid < 270) ? mid + 180 : mid;
      txt.setAttribute("transform", `rotate(${rot} ${lx.toFixed(2)} ${ly.toFixed(2)})`);
      txt.textContent = options[i].length > 6 ? options[i].slice(0, 6) + "…" : options[i];
      svg.appendChild(txt);
    }
  }

  function renderOpts() {
    const box = document.getElementById("opts");
    box.innerHTML = "";
    options.forEach((o, i) => {
      const el = document.createElement("div");
      el.className = "opt";
      el.innerHTML =
        `<span class="cdot" style="background:${PALETTE[i % PALETTE.length]}"></span>` +
        `<span>${escapeHtml(o)}</span>` +
        `<button class="x" title="削除" data-i="${i}">×</button>`;
      box.appendChild(el);
    });
    box.querySelectorAll(".x").forEach(b => {
      b.addEventListener("click", () => {
        options.splice(Number(b.getAttribute("data-i")), 1);
        save(); renderWheel(); renderOpts(); updateSpinState();
      });
    });
  }

  function renderPresets() {
    const box = document.getElementById("presets");
    box.innerHTML = "";
    Object.keys(PRESETS).forEach(name => {
      const b = document.createElement("button");
      b.className = "preset";
      b.textContent = name;
      b.addEventListener("click", () => {
        options = PRESETS[name].slice(0, MAX);
        save(); renderWheel(); renderOpts(); updateSpinState();
        resetResult();
      });
      box.appendChild(b);
    });
  }

  function updateSpinState() {
    const ok = options.length >= 2 && !spinning;
    document.getElementById("spinBtn").disabled = !ok;
    document.getElementById("hub").disabled = !ok;
    document.getElementById("hint").textContent =
      options.length < 2 ? "2つ以上の選択肢を入れてください" : `${options.length} / ${MAX} 個`;
  }

  function resetResult() {
    const r = document.getElementById("result");
    r.className = "result";
    r.innerHTML = `<span class="pre">ボタンかまん中をタップで回るよ</span>`;
  }

  function addOpt() {
    const input = document.getElementById("optInput");
    const v = input.value.trim();
    if (!v) return;
    if (options.length >= MAX) { document.getElementById("hint").textContent = "これ以上は追加できません（最大12個）"; return; }
    options.push(v);
    save(); renderWheel(); renderOpts(); updateSpinState();
    input.value = ""; input.focus();
  }

  function spin() {
    if (spinning || options.length < 2) return;
    spinning = true;
    updateSpinState();

    const n = options.length;
    const seg = 360 / n;
    const chosen = Math.floor(Math.random() * n);
    const centerAngle = chosen * seg + seg / 2;          // 回転0のときの当該セグメント中心（上=0, 時計回り）
    const targetMod = (360 - centerAngle) % 360;         // その中心をポインタ（上）へ
    const currentMod = ((rotation % 360) + 360) % 360;
    let delta = (targetMod - currentMod + 360) % 360;
    // セグメント内で少しゆらす（中心ぴったりを避ける）
    delta += (Math.random() - 0.5) * seg * 0.6;
    rotation += 360 * 5 + delta;

    document.getElementById("wheel").style.transform = `rotate(${rotation}deg)`;

    const r = document.getElementById("result");
    r.className = "result";
    r.innerHTML = `<span class="pre">回転中…</span>`;

    window.setTimeout(() => {
      spinning = false;
      updateSpinState();
      r.className = "result pop";
      r.innerHTML = `<span class="pre">🍽 今日のごはんは</span><span class="big">${escapeHtml(options[chosen])}！</span>`;
    }, 4500);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
  }

  // ---- イベント ----
  document.getElementById("spinBtn").addEventListener("click", spin);
  document.getElementById("hub").addEventListener("click", spin);
  document.getElementById("addOpt").addEventListener("click", addOpt);
  document.getElementById("optInput").addEventListener("keydown", e => { if (e.key === "Enter") addOpt(); });

  // ---- 起動 ----
  renderPresets();
  renderWheel();
  renderOpts();
  updateSpinState();
</script>
</body>
</html>
