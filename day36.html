<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体調メモ帳 — 今日のからだを一行で</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#eef2ec;--bg2:#e0e8de;
    --paper:#fbfdfa;
    --ink:#2f3a34;--sub:#7c887f;
    --line:#e0e8e1;
    --accent:#5f8a72;--accent-deep:#476a58;--accent-bg:#e6efe8;
    --c1:#6fa07e;/* とても良い */
    --c2:#93b487;
    --c3:#c9b878;/* ふつう */
    --c4:#d69f74;
    --c5:#c67f74;/* 不調 */
    --tag-bg:#eef2ec;--tag-on:#5f8a72;--tag-on-bg:#dcebe0;
    --danger:#b0685c;
    --shadow:rgba(60,80,66,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden}
  body{
    font-family:"Zen Kaku Gothic New",sans-serif;
    background:radial-gradient(1100px 560px at 50% -8%, #f4f8f2 0%, var(--bg1) 48%, var(--bg2) 100%);
    color:var(--ink);line-height:1.75;min-height:100vh;
    padding:0 18px 56px;-webkit-font-smoothing:antialiased;
  }
  .mincho{font-family:"Shippori Mincho B1",serif;}
  .wrap{max-width:600px;margin:0 auto;}

  header{text-align:center;padding:46px 0 14px;}
  .kicker{font-size:.72rem;letter-spacing:.34em;color:var(--accent);font-weight:500;margin-bottom:15px;text-indent:.34em;}
  h1{font-family:"Shippori Mincho B1",serif;font-weight:600;font-size:2.05rem;letter-spacing:.12em;margin-bottom:11px;}
  .lead{font-size:.87rem;color:var(--sub);letter-spacing:.03em;}

  /* ---- card ---- */
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:18px;
    padding:22px 20px;margin-top:20px;box-shadow:0 10px 30px -18px var(--shadow);
  }
  .today-date{text-align:center;margin-bottom:20px;}
  .today-date .d{font-family:"Shippori Mincho B1",serif;font-size:1.35rem;font-weight:600;letter-spacing:.08em;}
  .today-date .w{font-size:.78rem;color:var(--sub);letter-spacing:.14em;margin-top:2px;}

  .sec-label{font-size:.76rem;letter-spacing:.2em;color:var(--sub);margin:0 0 11px 2px;font-weight:500;}
  .block + .block{margin-top:22px;}

  /* condition faces */
  .faces{display:flex;gap:8px;justify-content:space-between;}
  .face{
    flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;
    padding:12px 4px 9px;cursor:pointer;text-align:center;transition:.16s;
  }
  .face svg{display:block;margin:0 auto 6px;width:30px;height:30px;}
  .face .fl{font-size:.66rem;color:var(--sub);letter-spacing:.02em;}
  .face:hover{border-color:var(--accent);}
  .face.on{border-color:currentColor;box-shadow:0 0 0 3px color-mix(in srgb, currentColor 16%, transparent);}
  .face.on .fl{color:var(--ink);font-weight:500;}

  /* sleep stepper */
  .stepper{display:flex;align-items:center;justify-content:center;gap:18px;}
  .stepper button{
    width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);
    background:#fff;font-size:1.5rem;color:var(--accent-deep);cursor:pointer;
    line-height:1;transition:.15s;font-family:inherit;
  }
  .stepper button:hover{border-color:var(--accent);background:var(--accent-bg);}
  .stepper .val{font-family:"Shippori Mincho B1",serif;font-size:1.9rem;font-weight:600;min-width:104px;text-align:center;}
  .stepper .val small{font-size:.82rem;color:var(--sub);font-weight:400;margin-left:3px;font-family:"Zen Kaku Gothic New";}
  .sleep-none{text-align:center;margin-top:8px;}
  .sleep-none button{background:none;border:none;color:var(--sub);font-size:.76rem;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px;}

  /* tags */
  .tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{
    border:1.5px solid var(--line);background:var(--tag-bg);color:var(--sub);
    border-radius:999px;padding:7px 14px;font-size:.82rem;cursor:pointer;transition:.15s;
    font-family:inherit;letter-spacing:.02em;
  }
  .tag:hover{border-color:var(--accent);}
  .tag.on{background:var(--tag-on-bg);border-color:var(--tag-on);color:var(--accent-deep);font-weight:500;}

  textarea{
    width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;
    padding:12px 13px;font-family:inherit;font-size:.9rem;color:var(--ink);
    resize:vertical;min-height:64px;line-height:1.7;
  }
  textarea:focus{outline:none;border-color:var(--accent);}
  textarea::placeholder{color:#b3bdb4;}

  .save{
    width:100%;margin-top:22px;padding:15px;border:none;border-radius:13px;cursor:pointer;
    background:var(--accent);color:#fff;font-family:"Shippori Mincho B1",serif;
    font-size:1.02rem;letter-spacing:.14em;font-weight:500;transition:.16s;
  }
  .save:hover{background:var(--accent-deep);}
  .saved-note{text-align:center;font-size:.78rem;color:var(--accent);margin-top:12px;min-height:1.1em;letter-spacing:.06em;}

  /* ---- history ---- */
  .hist-head{display:flex;align-items:baseline;justify-content:space-between;margin:38px 2px 4px;}
  .hist-head h2{font-family:"Shippori Mincho B1",serif;font-size:1.15rem;font-weight:600;letter-spacing:.1em;}
  .hist-head .cnt{font-size:.76rem;color:var(--sub);}

  .empty{text-align:center;color:var(--sub);font-size:.86rem;padding:30px 0 6px;}

  .entry{
    background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-top:12px;display:flex;gap:13px;align-items:flex-start;
    box-shadow:0 6px 20px -16px var(--shadow);
  }
  .entry .dot{flex:none;width:13px;height:13px;border-radius:50%;margin-top:6px;}
  .entry .body{flex:1;min-width:0;}
  .entry .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .entry .edate{font-family:"Shippori Mincho B1",serif;font-size:.98rem;font-weight:500;letter-spacing:.04em;}
  .entry .cond{font-size:.78rem;color:var(--sub);}
  .entry .sleep{font-size:.76rem;color:var(--sub);}
  .entry .etags{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;}
  .entry .et{font-size:.72rem;background:var(--tag-bg);color:var(--accent-deep);border-radius:999px;padding:2px 9px;}
  .entry .ememo{font-size:.82rem;color:var(--ink);margin-top:7px;white-space:pre-wrap;word-break:break-word;}
  .entry .ebtns{margin-top:9px;display:flex;gap:14px;}
  .entry .ebtns button{background:none;border:none;font-size:.74rem;cursor:pointer;font-family:inherit;color:var(--sub);padding:0;}
  .entry .ebtns .ed:hover{color:var(--accent);}
  .entry .ebtns .del:hover{color:var(--danger);}

  footer{text-align:center;margin-top:46px;font-size:.72rem;color:var(--sub);letter-spacing:.1em;}

  @media (max-width:640px){
    header{padding:36px 0 10px;}
    h1{font-size:1.72rem;}
    .card{padding:18px 15px;}
    .face svg{width:26px;height:26px;}
    .face .fl{font-size:.6rem;}
    .stepper{gap:12px;}
    .stepper .val{font-size:1.6rem;min-width:88px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">DAILY　CONDITION　LOG</div>
    <h1>体調メモ帳</h1>
    <p class="lead">今日のからだを、一行だけ書きとめて。</p>
  </header>

  <!-- 今日の記録 -->
  <section class="card">
    <div class="today-date">
      <div class="d" id="todayD">—</div>
      <div class="w" id="todayW">—</div>
    </div>

    <div class="block">
      <p class="sec-label">きょうの体調</p>
      <div class="faces" id="faces"></div>
    </div>

    <div class="block">
      <p class="sec-label">睡眠時間</p>
      <div class="stepper">
        <button type="button" id="sMinus" aria-label="減らす">−</button>
        <div class="val"><span id="sleepVal">7.0</span><small>時間</small></div>
        <button type="button" id="sPlus" aria-label="増やす">＋</button>
      </div>
      <div class="sleep-none"><button type="button" id="sleepNone">記録しない</button></div>
    </div>

    <div class="block">
      <p class="sec-label">気になること <span style="color:#b3bdb4;font-weight:400">（あれば）</span></p>
      <div class="tags" id="tags"></div>
    </div>

    <div class="block">
      <p class="sec-label">ひとことメモ</p>
      <textarea id="memo" placeholder="例）夕方から少しだるい。早めに休む。" maxlength="140"></textarea>
    </div>

    <button class="save" id="saveBtn">きょうを記録する</button>
    <div class="saved-note" id="savedNote"></div>
  </section>

  <!-- これまで -->
  <div class="hist-head">
    <h2>これまでの記録</h2>
    <span class="cnt" id="histCnt"></span>
  </div>
  <div id="history"></div>

  <footer>Built by usami_louis</footer>
</div>

<script>
(function(){
  "use strict";
  var KEY = "taicho_v1";

  // ---- 体調レベル定義 ----
  var CONDS = [
    {v:5, label:"とても良い", color:"var(--c1)", mouth:"smile"},
    {v:4, label:"良い",       color:"var(--c2)", mouth:"smile"},
    {v:3, label:"ふつう",     color:"var(--c3)", mouth:"flat"},
    {v:2, label:"少し不調",   color:"var(--c4)", mouth:"frown"},
    {v:1, label:"不調",       color:"var(--c5)", mouth:"frown"}
  ];
  var TAG_LIST = ["頭痛","腹痛","だるさ","微熱","のど・せき","鼻水","めまい","肩こり","胃の不調","生理","気分の落ち込み","眠気"];

  // ---- state ----
  var store = load();
  var draft = { cond:0, sleep:7.0, sleepOn:true, tags:[], memo:"" };
  var editingDate = null; // 編集中の日付キー（nullなら今日）

  var todayKey = dateKey(new Date());

  // ---- helpers ----
  function load(){
    try{ var o = JSON.parse(localStorage.getItem(KEY)); if(o && o.entries) return o; }catch(e){}
    return { entries:{} };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseKey(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  var WD = ["日","月","火","水","木","金","土"];
  function fmtLong(d){ return d.getFullYear()+"年 "+(d.getMonth()+1)+"月 "+d.getDate()+"日"; }
  function fmtShort(d){ return d.getFullYear()+"."+pad(d.getMonth()+1)+"."+pad(d.getDate()); }
  function condOf(v){ for(var i=0;i<CONDS.length;i++){ if(CONDS[i].v===v) return CONDS[i]; } return null; }

  function faceSVG(color, mouth){
    var m = mouth==="smile" ? "M20 34 Q30 42 40 34" : mouth==="frown" ? "M20 38 Q30 30 40 38" : "M21 36 L39 36";
    return '<svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">'+
      '<circle cx="30" cy="30" r="21" fill="'+color+'" opacity="0.16"/>'+
      '<circle cx="30" cy="30" r="21" stroke="'+color+'" stroke-width="2.4"/>'+
      '<circle cx="22" cy="25" r="2.4" fill="'+color+'"/>'+
      '<circle cx="38" cy="25" r="2.4" fill="'+color+'"/>'+
      '<path d="'+m+'" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round"/></svg>';
  }

  // ---- render 今日フォーム ----
  var elFaces = document.getElementById("faces");
  var elTags  = document.getElementById("tags");

  function buildFaces(){
    elFaces.innerHTML = "";
    CONDS.forEach(function(c){
      var b = document.createElement("div");
      b.className = "face";
      b.style.color = c.color;
      b.innerHTML = faceSVG(c.color, c.mouth) + '<div class="fl">'+c.label+'</div>';
      b.addEventListener("click", function(){ draft.cond = (draft.cond===c.v?0:c.v); paintFaces(); clearNote(); });
      b.dataset.v = c.v;
      elFaces.appendChild(b);
    });
  }
  function paintFaces(){
    var nodes = elFaces.children;
    for(var i=0;i<nodes.length;i++){
      nodes[i].classList.toggle("on", +nodes[i].dataset.v === draft.cond);
    }
  }
  function buildTags(){
    elTags.innerHTML = "";
    TAG_LIST.forEach(function(t){
      var b = document.createElement("button");
      b.type="button"; b.className="tag"; b.textContent=t;
      b.addEventListener("click", function(){
        var i = draft.tags.indexOf(t);
        if(i>=0) draft.tags.splice(i,1); else draft.tags.push(t);
        b.classList.toggle("on", draft.tags.indexOf(t)>=0);
        clearNote();
      });
      b.dataset.t = t;
      elTags.appendChild(b);
    });
  }
  function paintTags(){
    var nodes = elTags.children;
    for(var i=0;i<nodes.length;i++){
      nodes[i].classList.toggle("on", draft.tags.indexOf(nodes[i].dataset.t)>=0);
    }
  }

  // ---- sleep stepper ----
  var elSleep = document.getElementById("sleepVal");
  function paintSleep(){
    if(!draft.sleepOn){ elSleep.textContent = "—"; elSleep.parentNode.querySelector("small").style.opacity=".3"; }
    else{ elSleep.textContent = draft.sleep.toFixed(1); elSleep.parentNode.querySelector("small").style.opacity="1"; }
  }
  document.getElementById("sMinus").addEventListener("click", function(){
    draft.sleepOn=true; draft.sleep=Math.max(0, +(draft.sleep-0.5).toFixed(1)); paintSleep(); clearNote();
  });
  document.getElementById("sPlus").addEventListener("click", function(){
    draft.sleepOn=true; draft.sleep=Math.min(14, +(draft.sleep+0.5).toFixed(1)); paintSleep(); clearNote();
  });
  document.getElementById("sleepNone").addEventListener("click", function(){
    draft.sleepOn = !draft.sleepOn; paintSleep(); clearNote();
  });

  var elMemo = document.getElementById("memo");
  elMemo.addEventListener("input", function(){ draft.memo = elMemo.value; clearNote(); });

  // ---- note ----
  var elNote = document.getElementById("savedNote");
  function clearNote(){ elNote.textContent=""; }

  // ---- draft <-> form ----
  function loadDraftFrom(entry){
    draft.cond = entry ? entry.cond : 0;
    draft.sleepOn = entry ? (entry.sleep!==null && entry.sleep!==undefined) : true;
    draft.sleep = (entry && draft.sleepOn) ? entry.sleep : 7.0;
    draft.tags = entry ? entry.tags.slice() : [];
    draft.memo = entry ? entry.memo : "";
    elMemo.value = draft.memo;
    paintFaces(); paintTags(); paintSleep();
  }

  // ---- save ----
  document.getElementById("saveBtn").addEventListener("click", function(){
    if(!draft.cond){ elNote.textContent = "体調をえらんでください。"; return; }
    var key = editingDate || todayKey;
    store.entries[key] = {
      cond: draft.cond,
      sleep: draft.sleepOn ? draft.sleep : null,
      tags: draft.tags.slice(),
      memo: draft.memo.trim()
    };
    save();
    renderHistory();
    if(editingDate){
      editingDate = null;
      setTodayHeader();
      loadDraftFrom(store.entries[todayKey] || null);
      elNote.textContent = "記録を更新しました。";
    }else{
      elNote.textContent = "きょうを記録しました。";
    }
  });

  // ---- today header ----
  var elD = document.getElementById("todayD"), elW = document.getElementById("todayW");
  var elSaveBtn = document.getElementById("saveBtn");
  function setTodayHeader(){
    var d, prefix, isToday = !editingDate || editingDate===todayKey;
    d = editingDate ? parseKey(editingDate) : new Date();
    elD.textContent = fmtLong(d);
    elW.textContent = WD[d.getDay()] + "曜日" + (isToday ? "・きょう" : "・編集中");
    elSaveBtn.textContent = isToday ? "きょうを記録する" : "この日を更新する";
  }

  // ---- history ----
  var elHist = document.getElementById("history"), elCnt = document.getElementById("histCnt");
  function renderHistory(){
    var keys = Object.keys(store.entries).sort().reverse();
    elCnt.textContent = keys.length ? keys.length + "日分" : "";
    if(!keys.length){
      elHist.innerHTML = '<div class="empty">まだ記録がありません。<br>きょうの体調から書きはじめましょう。</div>';
      return;
    }
    elHist.innerHTML = "";
    keys.forEach(function(k){
      var e = store.entries[k], c = condOf(e.cond), d = parseKey(k);
      var wrap = document.createElement("div");
      wrap.className = "entry";
      var tagsHtml = e.tags && e.tags.length
        ? '<div class="etags">'+ e.tags.map(function(t){return '<span class="et">'+esc(t)+'</span>';}).join("") +'</div>' : "";
      var memoHtml = e.memo ? '<div class="ememo">'+esc(e.memo)+'</div>' : "";
      var sleepHtml = (e.sleep!==null && e.sleep!==undefined) ? '<span class="sleep">睡眠 '+e.sleep.toFixed(1)+'h</span>' : "";
      var todayMark = (k===todayKey) ? "（きょう）" : "";
      wrap.innerHTML =
        '<span class="dot" style="background:'+c.color+'"></span>'+
        '<div class="body">'+
          '<div class="top"><span class="edate">'+fmtShort(d)+"（"+WD[d.getDay()]+"）"+todayMark+'</span>'+
            '<span class="cond">'+c.label+'</span>'+ sleepHtml +'</div>'+
          tagsHtml + memoHtml +
          '<div class="ebtns"><button class="ed" data-k="'+k+'">編集</button>'+
            '<button class="del" data-k="'+k+'">削除</button></div>'+
        '</div>';
      elHist.appendChild(wrap);
    });
    // bind
    Array.prototype.forEach.call(elHist.querySelectorAll(".ed"), function(b){
      b.addEventListener("click", function(){ startEdit(b.dataset.k); });
    });
    Array.prototype.forEach.call(elHist.querySelectorAll(".del"), function(b){
      b.addEventListener("click", function(){
        var d = parseKey(b.dataset.k);
        if(confirm(fmtShort(d)+" の記録を削除しますか？")){
          delete store.entries[b.dataset.k];
          if(editingDate===b.dataset.k){ editingDate=null; setTodayHeader(); loadDraftFrom(store.entries[todayKey]||null); }
          save(); renderHistory();
        }
      });
    });
  }
  function startEdit(k){
    editingDate = k;
    setTodayHeader();
    loadDraftFrom(store.entries[k]);
    clearNote();
    document.querySelector(".card").scrollIntoView({behavior:"smooth", block:"start"});
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  // ---- init ----
  buildFaces(); buildTags();
  setTodayHeader();
  loadDraftFrom(store.entries[todayKey] || null);
  renderHistory();
})();
</script>
</body>
</html>
